name: Desplegar juego por FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tetris-harry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar en simgular.com
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Resolver directorio remoto
        id: remotedir
        env:
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          DIR="${FTP_SERVER_DIR:-./public_html/tetris-harry-potter/}"
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar solo archivos del juego
        run: |
          set -euo pipefail
          mkdir -p deploy/screenshots deploy/icons deploy/fonts
          cp index.html manifest.webmanifest theme.css story-mode.js story-profiles.js stories.js story-scenes.js deploy/
          # Solo imágenes sueltas del README (p. ej. selection.png); no screenshots/responsive/ del PR.
          shopt -s nullglob
          for asset in screenshots/*.png screenshots/*.jpg screenshots/*.jpeg screenshots/*.webp; do
            cp "$asset" deploy/screenshots/
          done
          for asset in icons/*; do
            cp "$asset" deploy/icons/
          done
          for asset in fonts/*; do
            cp "$asset" deploy/fonts/
          done

      - name: Subir por FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./deploy/
          server-dir: ${{ steps.remotedir.outputs.dir }}
          exclude: |
            **/.git*
            **/.github/**
            **/README.md
            **/LICENSE
            **/.ftp-deploy-sync-state.json