<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tetris Mágico">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a32b8"/>
      <stop offset="0.55" stop-color="#1b1350"/>
      <stop offset="1" stop-color="#0a0a2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.5" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9e6"/>
      <stop offset="1" stop-color="#ffd86b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="#6b3fa0" opacity="0.25"/>
  <!-- Tetromino blocks -->
  <g filter="url(#glow)">
    <rect x="88" y="118" width="52" height="52" rx="10" fill="#29d4ff" stroke="#0e6fa8" stroke-width="4"/>
    <rect x="140" y="118" width="52" height="52" rx="10" fill="#29d4ff" stroke="#0e6fa8" stroke-width="4"/>
    <rect x="88" y="170" width="52" height="52" rx="10" fill="#b35cff" stroke="#6b2bbf" stroke-width="4"/>
    <rect x="140" y="170" width="52" height="52" rx="10" fill="#b35cff" stroke="#6b2bbf" stroke-width="4"/>
    <rect x="324" y="132" width="48" height="48" rx="9" fill="#4be37a" stroke="#1a8f4c" stroke-width="4"/>
    <rect x="372" y="132" width="48" height="48" rx="9" fill="#4be37a" stroke="#1a8f4c" stroke-width="4"/>
    <rect x="324" y="180" width="48" height="48" rx="9" fill="#ff4d6d" stroke="#b31845" stroke-width="4"/>
    <rect x="348" y="228" width="48" height="48" rx="9" fill="#ff4d6d" stroke="#b31845" stroke-width="4"/>
    <rect x="196" y="92" width="44" height="44" rx="8" fill="#ffd93b" stroke="#c89000" stroke-width="3" opacity="0.9"/>
    <rect x="240" y="92" width="44" height="44" rx="8" fill="#ffd93b" stroke="#c89000" stroke-width="3" opacity="0.9"/>
    <rect x="284" y="92" width="44" height="44" rx="8" fill="#ffd93b" stroke="#c89000" stroke-width="3" opacity="0.9"/>
    <rect x="328" y="92" width="44" height="44" rx="8" fill="#ffd93b" stroke="#c89000" stroke-width="3" opacity="0.9"/>
  </g>
  <!-- Wand -->
  <path d="M118 378 Q200 310 248 268" stroke="#c9a870" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="112" cy="384" r="18" fill="url(#gold)" stroke="#c89000" stroke-width="3"/>
  <!-- Lightning bolt -->
  <path d="M268 168 L228 268 L268 268 L244 368 L348 228 L298 228 L328 168 Z" fill="url(#bolt)" stroke="#ffcf4a" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M268 168 L228 268 L268 268 L244 368 L348 228 L298 228 L328 168 Z" fill="none" stroke="#fff" stroke-width="2" opacity="0.35"/>
  <!-- Sparkles -->
  <circle cx="400" cy="340" r="6" fill="#fff" opacity="0.85"/>
  <circle cx="420" cy="300" r="4" fill="#ffd86b"/>
  <circle cx="96" cy="260" r="5" fill="#9fe3ff"/>
</svg>